name: HAT_BCI_test
model_type: HATModel
scale: 1
num_gpu: 0
manual_seed: 0
tile:
  tile_size: 256
  tile_pad: 32

datasets:
  test_1:
    name: BCI
    type: PairedImageDataset
    dataroot_gt: ./datasets/BCI/test_IHC
    dataroot_lq: ./datasets/BCI/test_HE
    io_backend:
      type: disk

network_g:
  type: HAT
  upscale: 1
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: ''
  resi_connection: '1conv'

path:
  pretrain_network_g: experiments/pretrained_models/HAT_SRx4_ImageNet-pretrain.pth
  strict_load_g: false
  param_key_g: params_ema

val:
  save_img: true
  suffix: ~

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false