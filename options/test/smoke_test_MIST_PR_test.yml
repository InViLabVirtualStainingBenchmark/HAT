name: smoke_test_MIST_PR_test
model_type: HATModel
scale: 1
num_gpu: 1
manual_seed: 0

tile:
  tile_size: 128
  tile_pad: 16

datasets:
  test_MIST:
    name: MIST_PR_test_set
    type: PairedImageDataset
    dataroot_gt: datasets/MIST/PR/test_B
    dataroot_lq: datasets/MIST/PR/test_A
    io_backend:
      type: disk

# network structures
network_g:
  type: HAT
  upscale: 1
  in_chans: 3
  img_size: 64
  window_size: 8
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [4, 4, 4, 4]
  embed_dim: 96
  num_heads: [6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# path
path:
  pretrain_network_g: ./experiments/smoke_test_MIST_PR/models/net_g_latest.pth
  strict_load_g: true
  param_key_g: 'params_ema'

# validation settings
val:
  save_img: true
  suffix: ~

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
