name: test_HAT_MIST_HER2
model_type: HATModel
scale: 1
num_gpu: 1
manual_seed: 0

tile:
  tile_size: 256
  tile_pad: 32

datasets:
  test_1:
    name: MIST_HER2_test
    type: PairedImageDataset
    dataroot_gt: /scratch/antwerpen/212/vsc21216/unified/datasets/MIST/HER2/valB
    dataroot_lq: /scratch/antwerpen/212/vsc21216/unified/datasets/MIST/HER2/valA
    io_backend:
      type: disk

network_g:
  type: HAT
  upscale: 1
  in_chans: 3
  img_size: 64
  window_size: 16
  compress_ratio: 3
  squeeze_factor: 30
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [6, 6, 6, 6, 6, 6]
  embed_dim: 180
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: ''
  resi_connection: '1conv'

path:
  pretrain_network_g: /data/antwerpen/212/vsc21216/projects/unified/outputs/hat/MIST_HER2/checkpoints/net_g_latest.pth
  strict_load_g: true
  param_key_g: params_ema

val:
  save_img: true
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false