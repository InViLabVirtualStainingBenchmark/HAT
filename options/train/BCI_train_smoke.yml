name: smoke_test_BCI
model_type: HATModel
scale: 1
num_gpu: 0          # changed: no GPU
manual_seed: 0

tile:
  tile_size: 128
  tile_pad: 16

datasets:
  train:
    name: BCI_train
    type: PairedImageDataset
    dataroot_gt: datasets/BCI/train_IHC
    dataroot_lq: datasets/BCI/train_HE
    io_backend:
      type: disk
    gt_size: 128
    use_hflip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 0   # changed: 0 for Windows (avoids multiprocessing issues)
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: BCI_val
    type: PairedImageDataset
    dataroot_gt: datasets/BCI/test_IHC
    dataroot_lq: datasets/BCI/test_HE
    io_backend:
      type: disk

network_g:
  type: HAT
  upscale: 1
  in_chans: 3
  img_size: 64
  window_size: 8
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [4, 4, 4, 4]
  embed_dim: 96
  num_heads: [6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: ''           # changed: no upsampling for scale=1
  resi_connection: '1conv'

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [920]
    gamma: 0.5

  total_iter: 920       # changed: 1 full epoch (920 images)
  warmup_iter: -1

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 920         # changed: validate once at end of epoch
  save_img: false       # changed: skip saving images (saves time/space)
  pbar: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 50        # changed: print every 50 iters instead of every 1
  save_checkpoint_freq: 920   # changed: save once at the end
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500