# general settings
name: smoke_test_MIST_ER
model_type: HATModel
scale: 1
num_gpu: 0
manual_seed: 0

tile:
  tile_size: 128
  tile_pad: 16

# dataset and data loader settings
datasets:
  train:
    name: MIST_ER_train
    type: PairedImageDataset
    dataroot_gt: datasets/MIST/ER/train_B
    dataroot_lq: datasets/MIST/ER/train_A
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: MIST_ER_val
    type: PairedImageDataset
    dataroot_gt: datasets/MIST/ER/test_B
    dataroot_lq: datasets/MIST/ER/test_A
    io_backend:
      type: disk

# network structures
network_g:
  type: HAT
  upscale: 1
  in_chans: 3
  img_size: 64
  window_size: 8
  compress_ratio: 24
  squeeze_factor: 24
  conv_scale: 0.01
  overlap_ratio: 0.5
  img_range: 1.
  depths: [4, 4, 4, 4]
  embed_dim: 96
  num_heads: [6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: ''
  resi_connection: '1conv'

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [10]
    gamma: 0.5

  total_iter: 10
  warmup_iter: -1

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: 10
  save_img: false
  pbar: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 5
  save_checkpoint_freq: 10
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500